    uDither: { value: T.pos.pontilhado }, uGrain: { value: T.pos.grao }, uGrainT: { value: 0 }, uOff: { value: new THREE.Vector2() }, uTime: { value: 0 }, uFlash: { value: 0 },
  },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tScene; uniform vec2 uRes; uniform vec3 uPal[${MAXPAL}]; uniform int uN;
    uniform float uPen, uCorModo, uTipo, uPonto, uLo, uHi, uGama, uContrast, uBright, uDither, uGrain, uGrainT, uTime, uFlash, uWhite; uniform vec2 uOff;
    varying vec2 vUv;
    const float B[64] = float[64](${BAYER8.map(v => v.toFixed(1)).join(',')});
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    const vec3 W = vec3(.8, 1.15, .6); // peso perceptivo da distância (o verde/luminância pesa mais)
    void main(){
      vec2 px = floor(vUv * uRes), wp = px + uOff; // wp: pixel preso ao chão (o padrão anda junto com a câmera, não fica colado na tela)
      vec3 c = texture2D(tScene, (px + .5) / uRes).rgb;

      if (uWhite > 0.) l2 = l * (1. + l / (uWhite * uWhite)) / (1. + l);

      l2 = (l2 - .5) * uContrast + .5 + uBright + uFlash + (hash(wp) - .5) * uGrain + (hash(px + floor(uTime * 12.)) - .5) * uGrainT; // grão fixo no mundo; só a sanidade baixa o faz ferver
      c = l > 1e-4 ? c * (max(l2, 0.) / l) : vec3(max(l2, 0.));      // o tom muda, o matiz fica
      // melhor PAR (i, j) e proporção t: a mistura uPal[i]→uPal[j] que passa mais perto da cor (todos os pares da paleta)
      float best = 1e9, bt = 0.; int ia = 0, ib = 0;
      if (uCorModo > .5) { // degradê: a luminância anda pela rampa, sempre entre dois tons vizinhos
        float x = clamp(l2, 0., 1.) * float(uN - 1);

      } else
      for (int i = 0; i < ${MAXPAL}; i++) { if (i >= uN) break; for (int j = 0; j < ${MAXPAL}; j++) {
        if (j >= uN) break;
        if (j <= i) continue;
        vec3 d = uPal[j] - uPal[i];
        float t = clamp(dot((c - uPal[i]) * W, d * W) / dot(d * W, d * W), 0., 1.);
        vec3 e = (uPal[i] + d * t - c) * W;
        float err = dot(e, e) + uPen * dot(d * W, d * W) * t * (1. - t);   // pares muito distantes custam mais (T: mais/menos)
        if (err < best) { best = err; bt = t; ia = i; ib = j; }

      vec2 dp = floor(wp / uPonto); float thr;
      if (uTipo < .5) thr = (B[int(mod(dp.x, 8.)) + int(mod(dp.y, 8.)) * 8] + .5) / 64.;
      else if (uTipo < 1.5) thr = (B[int(mod(dp.x, 4.)) + int(mod(dp.y, 4.)) * 8] / 4. + .5) / 16.; // o canto da matriz 8x8 é a matriz 4x4
      else if (uTipo < 2.5) thr = (B[int(mod(dp.x, 2.)) + int(mod(dp.y, 2.)) * 8] / 16. + .5) / 4.;
      else if (uTipo < 3.5) thr = fract(52.9829189 * fract(dot(dp, vec2(.06711056, .00583715))));
      else if (uTipo < 4.5) thr = (mod(dp.y, 4.) + .5) / 4.;
      else if (uTipo < 5.5) thr = .5 + .25 * (cos(dp.x * .7854) + cos(dp.y * .7854));
      else if (uTipo < 6.5) thr = (mod(dp.x + dp.y, 4.) + .5) / 4.;                       // diagonal
      else if (uTipo < 7.5) thr = mod(dp.x + dp.y, 2.) < .5 ? .25 : .75;                 // xadrez
      else if (uTipo < 8.5) thr = (min(mod(dp.x, 4.), mod(dp.y, 4.)) + .5) / 4.;         // trama em cruz

  depthTest: false, depthWrite: false,
});
const postA = new THREE.Scene(); postA.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), ditherMat));

// Passo temporal: um pixel que troca de cor passa pelo meio em vez de saltar; o que não troca segue a cor pura da paleta.
// O quadro anterior é lido deslocado pelos passos da câmera (uShift), para comparar o mesmo ponto do chão.
const TEMPORAL = qs.get('temporal') !== '0';
const tempRT = [0, 1].map(() => new THREE.WebGLRenderTarget(LOWRES, LOWRES, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false }));
let tempI = 0;
const tempMat = new THREE.ShaderMaterial({
  uniforms: { tCur: { value: ditherRT.texture }, tPrev: { value: tempRT[1].texture }, uShift: { value: new THREE.Vector2() }, uRes: { value: LOWRES }, uK: { value: 1 } },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tCur, tPrev; uniform vec2 uShift; uniform float uRes, uK;
    varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tCur, vUv).rgb;
      vec2 p = vUv + uShift / uRes;
      float k = (p.x < 0. || p.y < 0. || p.x > 1. || p.y > 1.) ? 1. : uK; // o que acabou de entrar na tela não tem passado
      gl_FragColor = vec4(mix(texture2D(tPrev, p).rgb, c, k), 1.);
    }`,
  depthTest: false, depthWrite: false,
});
const postT = new THREE.Scene(); postT.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), tempMat));

// Lente: zona nítida (pontilhada) em volta do andarilho; fora dela o pontilhado vira tom contínuo
const lensMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: ditherRT.texture }, tDepth: { value: sceneRT.depthTexture }, uRes: { value: LOWRES },
    uFocus: { value: new THREE.Vector2(.5, .5) }, uFocusDepth: { value: 30 }, uNear: { value: .5 }, uFar: { value: 140 },
    uR0: { value: LENS.raio }, uR1: { value: LENS.queda }, uDepthK: { value: LENS.profundidade }, uMaxR: { value: LENS.max * LOWRES / 256 }, uAmount: { value: 1 }, uLimite: { value: 1.5 },

  vertexShader: VERT,

    uniform sampler2D tColor, tDepth; uniform vec2 uFocus; uniform float uRes, uFocusDepth, uNear, uFar, uR0, uR1, uDepthK, uMaxR, uAmount, uLimite;
    varying vec2 vUv;

const postL = new THREE.Scene(); postL.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), lensMat));

const UI = document.createElement('canvas'); UI.width = UI.height = 1024;   // 2 px por unidade lógica (512): texto do kit nítido
const g = UI.getContext('2d'); g.imageSmoothingEnabled = false;
const uiTex = new THREE.CanvasTexture(UI); uiTex.minFilter = uiTex.magFilter = THREE.LinearFilter; uiTex.generateMipmaps = false;

// Passo B: filme/CRT + interferência de fita (uGlitch) para o noclip e a sanidade baixa
// a moldura da tela (Forja → Jogo → Interface → Moldura da tela): cor e opacidade do que fica fora da imagem, raio dos
// cantos, curvatura do vidro, tamanho da tela na janela, espessura (borda que come a imagem) e suavidade. Padrão = o do index
const MOLD = { cor: '#000000', opacidade: 1, cantos: .055, curva: .07, tamanho: .97, espessura: 0, suave: .003, ...(JOGO.interface?.moldura || {}) };
const crtMat = new THREE.ShaderMaterial({

    uScan: { value: T.pos.scan }, uFlicker: { value: T.pos.flicker }, uFade: { value: 0 }, uDark: { value: PAL[0] }, uGlitch: { value: 0 },
    uVinI: { value: 0 }, uVinA: { value: .45 }, uVinB: { value: 1 }, uBorda: { value: 0 }, uBordaS: { value: .05 }, uBordaF: { value: 0 },
    uMolCor: { value: new THREE.Color(MOLD.cor) }, uMolA: { value: MOLD.opacidade }, uMolR: { value: MOLD.cantos }, uCurva: { value: MOLD.curva },
    uMolE: { value: MOLD.espessura }, uMolS: { value: MOLD.suave },
  },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tDither, tUI; uniform vec2 uScreen, uSub; uniform float uSquare, uRes, uTime, uVig, uAberr, uScan, uFlicker, uFade, uGlitch; uniform vec3 uDark;
    uniform float uVinI, uVinA, uVinB, uBorda, uBordaS, uBordaF; // a vinheta e a borda da abertura (CapaBolhas._aplicar_vinheta)
    uniform vec3 uMolCor; uniform float uMolA, uMolR, uCurva, uMolE, uMolS; // a moldura (Jogo → Interface)
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    float sdRound(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
    vec3 soft(vec2 uv){ float o = .45 / uRes; vec3 s = texture2D(tDither, uv).rgb * .4;
      s += texture2D(tDither, uv + vec2(o, 0.)).rgb * .15; s += texture2D(tDither, uv - vec2(o, 0.)).rgb * .15;

      float mask = 1. - smoothstep(-uMolS - .0005, uMolS + .0005, d);
      vec2 uv = q + .5 + uSub; // a fração de pixel que a câmera encaixada deixou de andar: a rolagem continua suave
      float band = floor(uv.y * 48.), gt = floor(uTime * 20.);
      float tear = step(1. - uGlitch * .55, hash(vec2(band, gt))) * (hash(vec2(band + 7., gt)) - .5) * .12 * uGlitch;
      uv.x += tear;

      vec3 col = vec3(soft(uv + vec2(a, 0.)).r, soft(uv).g, soft(uv - vec2(a, 0.)).b);

      vec4 ui = texture2D(tUI, q + .5); col = mix(col, ui.rgb, ui.a);

  depthTest: false, depthWrite: false,
});
const postB = new THREE.Scene(); postB.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), crtMat));

/* A RESOLUÇÃO DA ABERTURA (Forja → Abertura → Câmera → grade): a imagem 3D da tela de título pode ter outra grade de
   pixels; fora dela volta a de sempre (LOWRES). */
let RES = LOWRES;
function aplicaGrade(n) {
  n = Math.max(64, Math.min(1024, n | 0)); if (n === RES) return; RES = n;
  for (const rt of [sceneRT, ditherRT, ...tempRT]) rt.setSize(n, n);
  lensRT.setSize(n * 2, n * 2);
  ditherMat.uniforms.uRes.value.set(n, n); tempMat.uniforms.uRes.value = n; lensMat.uniforms.uRes.value = n; crtMat.uniforms.uRes.value = n;
}

/* O FUNDO POR IMAGEM (Forja → Abertura → Fundo e vinheta): no lugar da cena 3D, a imagem (UI/abertura/…) com zoom lento
   e escurecer; passa pela paleta e pelo pontilhado (como a cena) ou entra pronta */
const FUNDO = { arq: '', tex: null };
function fundoImagem() {
  const arq = AB.fundo_tipo === 'imagem' ? AB.fundo_imagem || '' : '';
  if (arq === FUNDO.arq) return; FUNDO.arq = arq; FUNDO.tex?.dispose(); FUNDO.tex = null;
  if (arq) new THREE.TextureLoader().load(arq, (tx) => { if (FUNDO.arq !== arq) return tx.dispose(); tx.minFilter = tx.magFilter = THREE.LinearFilter; FUNDO.tex = tx; fundoMat.uniforms.tImg.value = tx; bolhasMat.uniforms.fundoImg.value = tx; },
    undefined, () => console.warn('abertura: não achei a imagem de fundo', arq));
}
const fundoMat = new THREE.ShaderMaterial({
  uniforms: { tImg: { value: null }, uAsp: { value: 1 }, uZoom: { value: 1 }, uEsc: { value: 0 } },
  vertexShader: VERT,
  fragmentShader: `uniform sampler2D tImg; uniform float uAsp, uZoom, uEsc; varying vec2 vUv;
    void main(){ vec2 uv = (vUv - .5) / uZoom; uv.x *= min(1., 1. / uAsp); uv.y *= min(1., uAsp); // cobre o quadrado sem esticar
      gl_FragColor = vec4(texture2D(tImg, uv + .5).rgb * (1. - uEsc), 1.); }`,
  depthTest: false, depthWrite: false,
});
const postF = new THREE.Scene(); postF.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fundoMat));

/* A ABERTURA 2 (BOLHAS): porte de forja/abertura_bolhas/bolhas.gdshader e CapaBolhas.gd. As formas vêm da imagem de
   referência (UI/bolhas/bolhas.json: centro + série de Fourier do raio pelo ângulo); as bolhas refratam a imagem que o
   jogo já desenhou (com pontilhado e lente) e respiram devagar. Tudo em coordenadas da Godot (y para baixo). */
const BOLHAS = { lista: null, pedido: false, t: 0 }, BOLHAS_MAX = 24;
function carregaBolhas() {
  if (BOLHAS.pedido) return; BOLHAS.pedido = true;
  fetch('UI/bolhas/bolhas.json').then(r => r.json()).then(d => { BOLHAS.lista = (d.bolhas || []).slice(0, BOLHAS_MAX); }).catch(() => console.warn('abertura 2: falta UI/bolhas/bolhas.json (salve a abertura na Forja)'));
}
const bolhasRT = new THREE.WebGLRenderTarget(1024, 1024, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false });
const cor3 = (h) => new THREE.Color(h || '#000000'); // ColorManagement desligado: o hex cru, como o source_color de canvas da Godot
const bolhasMat = new THREE.ShaderMaterial({
  uniforms: {
    fundo: { value: lensRT.texture }, fundoImg: { value: null }, temImg: { value: 0 }, fundo_zoom: { value: 1 },
    cena_crt: { value: 1 }, cena_vig: { value: 0 }, cena_aberr: { value: 0 }, cena_dark: { value: new THREE.Color() },
    dados: { value: Array.from({ length: BOLHAS_MAX * 6 }, () => new THREE.Vector4()) }, n: { value: 0 }, tempo: { value: 0 }, morph: { value: 1 },
    lente: { value: 1 }, aberracao: { value: .25 }, brilho: { value: 1 }, tingir: { value: 1 },
    rosa_escuro: { value: new THREE.Color() }, rosa_claro: { value: new THREE.Color() }, cor_parede: { value: new THREE.Color(1, 1, 1) },
    cor_bolha: { value: new THREE.Color() }, bolha_cor: { value: 0 }, cor_vidro: { value: new THREE.Color() }, cor_vidro_escuro: { value: new THREE.Color() }, vidro_cor: { value: 0 },
    cor_sombra: { value: new THREE.Color() }, sombra: { value: 1 }, cor_brilho: { value: new THREE.Color(1, 1, 1) }, reflexo: { value: 1 },
    parede_escuro: { value: 1 }, tom_lo: { value: .08 }, tom_hi: { value: .62 }, alfa: { value: 1 },
    parede_grossura: { value: 0 }, parede_blur: { value: 0 }, parede_blur_borda: { value: 0 },
  },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D fundo, fundoImg; uniform float temImg, fundo_zoom, cena_crt, cena_vig, cena_aberr; uniform vec3 cena_dark;
    uniform vec4 dados[${BOLHAS_MAX * 6}]; uniform int n; uniform float tempo, morph, lente, aberracao, brilho, tingir;
    uniform vec3 rosa_escuro, rosa_claro, cor_parede, cor_bolha, cor_vidro, cor_vidro_escuro, cor_sombra, cor_brilho;
    uniform float bolha_cor, vidro_cor, sombra, reflexo, parede_escuro, tom_lo, tom_hi, alfa;
    uniform float parede_grossura, parede_blur, parede_blur_borda; // px de 1024 (Forja → Bolhas → Grossura e blur das paredes)
    varying vec2 vUv;
    const int K = 10; const float REFRACAO = 0.035; const vec3 LUMA = vec3(0.299, 0.587, 0.114);
    vec3 cru(vec2 uv) { vec2 t = vec2(uv.x, 1.0 - uv.y); return temImg > .5 ? texture2D(fundoImg, t).rgb : texture2D(fundo, t).rgb; }
    vec3 amostra(vec2 uv) {

      uv = clamp(uv, vec2(0.002), vec2(0.998));
      if (cena_crt < .5) return cru(uv);

      vec3 col = vec3(cru(uv + a).r, cru(uv).g, cru(uv - a).b);

    // raio r(θ) e a derivada dr/dθ da bolha i, com a respiração lenta
    vec2 raio(int i, float ang) {
      vec4 h = dados[i * 6]; float f = h.w, a0 = h.z, r = a0, dr = 0.0;
      float c1 = cos(ang), s1 = sin(ang), ck = c1, sk = s1;
      for (int k = 1; k <= K; k++) {
        vec4 q = dados[i * 6 + 1 + (k - 1) / 2];

    vec3 tingido_parede(vec3 c) {
      float s = smoothstep(tom_lo, tom_hi, dot(c, LUMA));
      vec3 duas = mix(mix(cor_sombra, cor_vidro_escuro, vidro_cor), mix(rosa_claro, cor_vidro, vidro_cor), s);
      vec3 crua = c * mix(vec3(1.0), desvio(cor_vidro), vidro_cor * s);

    void main() {
      vec2 p = vec2(vUv.x, 1.0 - vUv.y);

      for (int i = 0; i < ${BOLHAS_MAX}; i++) {
        if (i >= n) break;

// --- corvos: ciscam no jardim; se o andarilho chega perto, o bando levanta voo e some ---
function updateCrows(dt, t) {

// física dos balões na água (2D no plano da superfície): quem passa empurra, balão bate em balão (choque elástico
// amortecido), quica na borda, a água freia; boiam e balançam
function updateBalloons(dt, t) {
  const agents = [player, ...entities]; if (cat) agents.push(cat);
  const h = Math.min(dt, 1 / 30), R2 = BALLOON_R * 2;
  for (const ch of chunks.values()) {
    const bs = ch.balloons; if (!bs.length) continue;
    if (Math.hypot(bs[0].x - player.x, bs[0].z - player.z) > 30) continue;
    for (const b of bs) {

        const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz), reach = BALLOON_R + .35;
        if (d < reach && d > 1e-4) { const k = (reach - d) * 40 * h; b.vx += dx / d * k; b.vz += dz / d * k; }
      }
      const drag = Math.exp(-h * 1.4); b.vx *= drag; b.vz *= drag;
      b.vx += Math.sin(t * .3 + b.ph) * .02 * h; b.vz += Math.cos(t * .27 + b.ph * 1.3) * .02 * h; // correnteza fraca
    }
    for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) { // colisões entre balões
      const a = bs[i], b = bs[j], dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
      if (d >= R2 || d < 1e-5) continue;

      a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
      const vn = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
      if (vn < 0) { const imp = -vn * .8; a.vx -= nx * imp; a.vz -= nz * imp; b.vx += nx * imp; b.vz += nz * imp; } // restituição .6
    }

      b.x += b.vx * h; b.z += b.vz * h;

      if (b.x < x0) { b.x = x0; b.vx = Math.abs(b.vx) * .5; } else if (b.x > x1) { b.x = x1; b.vx = -Math.abs(b.vx) * .5; }
      if (b.z < z0) { b.z = z0; b.vz = Math.abs(b.vz) * .5; } else if (b.z > z1) { b.z = z1; b.vz = -Math.abs(b.vz) * .5; }

      b.o.rotation.z = Math.sin(t * .9 + b.ph) * .12 - b.vx * .25; b.o.rotation.x = b.vz * .25; // inclina para onde corre
    }
  }
}

// --- o gato: raro — só aparece em CAT_CHANCE dos níveis, longe, e se ficar para trás quase nunca volta;

  if (Math.random() >= chance) { hideCat(); return; }

  let x = player.x + 6, z = player.z;
  for (let tries = 0; tries < 40; tries++) {
    const a = Math.random() * Math.PI * 2, d = 16 + Math.random() * 14, i = Math.floor((player.x + Math.cos(a) * d) / C), j = Math.floor((player.z + Math.sin(a) * d) / C);
    const cx = (i + .5) * C, cz = (j + .5) * C;
    if (!isFree(cx, cz, .25) || !bfsPath(i, j, pi, pj)) continue;
    x = cx; z = cz; break;
  }
  Object.assign(cat, { x, z, prev: null, face: Math.random() * 7, ph: 0, sit: 0, met: false, meowT: GATO.miado_min / 2 + Math.random() * GATO.miado_min });
  catNext();
}

  const C = L.C, i = Math.floor(cat.x / C), j = Math.floor(cat.z / C), nb = cellNbrs(i, j);
  const opts = nb.length > 1 && cat.prev ? nb.filter(([a, b]) => a !== cat.prev[0] || b !== cat.prev[1]) : nb; // evita dar meia-volta
  const [a, b] = opts.length ? opts[Math.floor(Math.random() * opts.length)] : [i, j];
  cat.prev = [i, j]; cat.tx = (a + .5 + (Math.random() - .5) * .5) * C; cat.tz = (b + .5 + (Math.random() - .5) * .5) * C; cat.walkT = 0;
}
function meow() { sfx('miado'); }
function updateCat(dt, t) {
  if (!cat || !cat.on) return;
  const d = Math.hypot(cat.x - player.x, cat.z - player.z);
  if (d > 50) { placeCat(CAT_BACK); return; }
  let moving = false;
  if (cat.sit > 0) { cat.sit -= dt; if (cat.sit <= 0) catNext(); }
  else {
    const mx = cat.tx - cat.x, mz = cat.tz - cat.z, ml = Math.hypot(mx, mz);
    cat.walkT += dt;
    if (ml < .15 || cat.walkT > 7) { if (Math.random() < GATO.sentar) cat.sit = GATO.sentar_min + Math.random() * Math.max(0, GATO.sentar_max - GATO.sentar_min); else catNext(); }
    else {
      const s = Math.min(ml, GATO.velocidade * dt); cat.x += mx / ml * s; cat.z += mz / ml * s; moving = true;
      let df = Math.atan2(mx, mz) - cat.face; df = Math.atan2(Math.sin(df), Math.cos(df)); cat.face += df * Math.min(1, dt * 6);
      const p = { x: cat.x, z: cat.z }; collide(p, .18); cat.x = p.x; cat.z = p.z;
    }
  }

  if (moving) cat.ph += dt * 10;
  const sw = moving ? Math.sin(cat.ph) * .55 : 0;
  c.legs.forEach((l, n) => { l.rotation.x += ((sitting ? .45 : (n === 0 || n === 3 ? sw : -sw)) - l.rotation.x) * k; });
  c.body.rotation.x += ((sitting ? -.45 : 0) - c.body.rotation.x) * k;
  c.body.position.y = .22 + (moving ? Math.abs(Math.sin(cat.ph)) * .012 : 0);
  c.head.rotation.x += ((sitting ? .45 : 0) - c.head.rotation.x) * k;
  c.head.rotation.y = moving ? 0 : Math.sin(t * .6 + cat.face) * .6;
  c.tail.rotation.y = Math.sin(t * (moving ? 3 : 1.4)) * .4;
  c.root.position.set(cat.x, 0, cat.z); c.root.rotation.y = cat.face;
  if (d < GATO.achar && !cat.met) { cat.met = true; player.san = Math.max(player.san, GATO.sanidade_achar); showMsg('um gato — a sanidade volta'); meow(); flash = .2; }
  cat.meowT -= dt; if (cat.meowT <= 0) { cat.meowT = GATO.miado_min + Math.random() * Math.max(0, GATO.miado_max - GATO.miado_min); if (d < 10) meow(); }
  if (d < CAT_SAFE && !player.dead) player.san = Math.min(100, player.san + dt * (d < 2 ? GATO.sanidade_colado : GATO.sanidade_perto)); // ficar perto acalma
  cat.petT = Math.max(0, (cat.petT || 0) - dt);
  if (d < 1.3 && cat.petT <= 0 && game === 'play') { // [E] acariciar: ele para um pouco
    if (!msg || msg.s !== '[E] acariciar') showMsg('[E] acariciar', .3);
    if (keys.has('KeyE')) { keys.delete('KeyE'); cat.petT = 12; cat.sit = 4; player.san = Math.min(100, player.san + GATO.carinho); flash = .12; meow(); showMsg('ronronou'); sfx('ronronar'); }
  }
}

/* PRÉDIO — porte de title/Predio.gd (o montarTitulo do index com postes, chão e topo da Forja). r: o sorteio das janelas

function montarPredio(pai, r) {
  const L0 = AB.predio_comprimento, N = Math.max(1, AB.predio_andares | 0), D0 = -12, Y0 = 3.8, AND = 3.15, Y1 = Y0 + AND * N;

  for (let x = 1; x <= L0; x += 6) for (const z of [-1.3, D0 + 1.3]) mb.cyl(x, z, .42, 0, Y0, .62);
  mb.box(0, 0, -7.5, 34, Y0 - .1, D0 + .5, .2, 'N');
  for (let x = 2; x < 34; x += 2.4) { mb.box(x, 0, -7.46, x + 2.26, Y0 - .3, -7.4, r() < .5 ? 1.05 : .8, 'PE'); mb.box(x + 2.26, 0, -7.46, x + 2.4, Y0 - .1, -7.38, .12, 'N'); }
  mb.box(-.4, Y0 - .28, D0 - .4, L0 + .4, Y0, .4, .72); // laje sob o prédio

      mb.box(x + .05, y + 1.18, -.13, x + B - .05, y + AND - .12, -.05, q < .04 ? 1.2 : q < .1 ? .34 : q < .3 ? 1 : .86, q < .04 ? 'PE' : q < .1 ? 'N' : 'CY'); // reflexo do céu, cortina ou luz acesa

  for (let f = 0; f < N; f++) { const y = Y0 + f * AND; mb.box(-.2, y + .45, -5.3, -.08, y + AND - .35, -3.7, .22, 'N'); mb.box(-.24, y + .55, -5.2, -.12, y + AND - .45, -3.8, 1, 'CY'); mb.box(-.25, y + .45, -4.53, -.1, y + AND - .35, -4.47, .9); }

    const x = 4 + k * 7; mb.beam([x, Y1 + .7, -6], [x, Y1 + 4.2, -6], .07, .5, 'CL');

  const op = clamp(AB.chao_opacidade, 0, 1);
  if (op > .004) ch.commit(pai, (v, c) => new THREE.MeshLambertMaterial({ color: ctone(v, c), flatShading: true, transparent: op < .996, opacity: op, depthWrite: op >= .996 }), op >= .996);

/* ÁRVORES E CIDADE — Arvore.gd, TorreCidade.gd e TitleScene._ajustar_cenario/_ajustar_arvores. Sem cenário da Forja,
   as árvores são as do index e as torres as da cena da Godot (title/Abertura.tscn), que nascem escondidas como no index */
const ARVORES_INDEX = [[-27, -7, 5.4], [61, -2, 5.6], [68, -16, 7], [-40, -24, 8], [-20, -30, 7], [20, -34, 9], [46, -30, 8]];
const TORRES_CENA = [[-62, -70, 14, 26], [-50, -82, 12, 20], [92, -74, 16, 30], [104, -60, 12, 22], [84, -90, 14, 18], [-34, -48, 10, 24], [-78, -40, 12, 30],
  [-20, -66, 10, 17], [78, -44, 12, 26], [152.112, -24.7978, 14, 34], [62, -62, 10, 21], [-11.3052, -38, 10, 28], [-30, -52, 8, 21]];
function arvore(mb, x, y, z, giro, q, tom) {
  mb.xf = new THREE.Matrix4().makeRotationY(giro * D2R).setPosition(x, y, z);
  mb.cyl(0, 0, q * .08, 0, q, .16, 'AC', 6);
  for (const [a, b, c, k] of [[0, 1.1, 0, .78], [.45, .8, .25, .55], [-.45, .85, -.2, .6], [.1, 1.5, -.2, .5]]) mb.ico(a * q, b * q, c * q, k * q, .24 + k * .14 + tom);

}
function torreCidade(mb, lz, x, y, z, giro, largura, altura, tom, semTopo) {
  const w = largura / 2, h = altura, m = new THREE.Matrix4().makeRotationY(giro * D2R).setPosition(x, y, z);
  mb.xf = m; lz.xf = m;
  mb.box(-w, 0, -w, w, h, w, tom);
  for (let yy = 2; yy < h - 1; yy += 2.6) { mb.box(-w + .4, yy, w, w - .4, yy + .9, w + .05, .55, 'CY'); mb.box(-w - .05, yy, -w + .4, -w, yy + .9, w - .4, .55, 'CY'); }

}
function montarCenario(grp, obs) {
  const mb = construtor(), lz = construtor();
  const arv = obs ? obs.filter(o => o.tipo === 'arvore').map(o => [o.x, o.y || 0, o.z, o.rot || 0, o.altura || 6, o.tom || 0]) : ARVORES_INDEX.map(([x, z, q]) => [x, 0, z, 0, q, 0]);
  const tor = obs ? obs.filter(o => o.tipo === 'torre').map(o => [o.x, o.y || 0, o.z, o.rot || 0, o.largura || 12, o.altura || 24, o.tom ?? .95]) : TORRES_CENA.map(([x, z, l, a]) => [x, 0, z, 0, l, a, .95]);
  if (AB.arvores_mostrar && arv.length) {
    // densidade abaixo de 1 apaga originais pela semente; acima planta novas perto delas; deslocar, recuo e espalhar sobre o lugar original
    const k = AB.arvores_tamanho, dt = AB.arvores_tom, dens = Math.max(0, AB.arvores_densidade), sem = AB.arvores_semente | 0;
    const todas = arv.map(a => ({ a, extra: false })), r = rng(hashN(sem, 7)), nExtra = Math.max(0, Math.round(arv.length * (dens - 1)));
    for (let i = 0; i < nExtra; i++) { const o = arv[Math.floor(r.randf() * arv.length)], ang = r.randf() * Math.PI * 2, d = 3.5 + r.randf() * 5.5;
      todas.push({ extra: true, a: [o[0] + Math.cos(ang) * d, o[1], o[2] + Math.sin(ang) * d, r.randf() * 360, o[4] * (.7 + r.randf() * .45), o[5] + (r.randf() - .5) * .06] }); }
    todas.forEach(({ a, extra }, i) => {
      if (!extra && dens < 1 && (hashN(sem, i + 1) % 1000) / 1000 >= dens) return;
      const h = hashN(sem, i + 1, 3) % 100000, jx = ((h % 1000) / 500 - 1) * AB.arvores_espalhar, jz = (Math.floor(h / 1000) / 50 - 1) * AB.arvores_espalhar;
      arvore(mb, a[0] * AB.arvores_recuo + AB.arvores_x + jx, a[1], a[2] * AB.arvores_recuo + AB.arvores_z + jz, a[3], a[4] * k, a[5] + dt);
    });
  }
  if (AB.cidade_mostrar) for (const [x, y, z, giro, l, a, tom] of tor)
    torreCidade(mb, lz, x * AB.cidade_recuo, y, z * AB.cidade_recuo, giro, l * AB.cidade_largura, a * AB.cidade_altura, tom + AB.cidade_tom, hashN(Math.round(x), Math.round(z)) | 1);
  if (AB.torre_transmissao) { // a torre de transmissão do index
    const x = 82, z = -26, h = 30, w = 3.2;
    for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) mb.beam([x + a * w, 0, z + b * w], [x + a * .12 * w, h, z + b * .12 * w], .2, .16);
    for (let k = 1; k < 6; k++) { const y = h * k / 6, q = w * (1 - k / 6 * .88); mb.beam([x - q, y, z - q], [x + q, y, z - q], .12, .16); mb.beam([x - q, y, z + q], [x + q, y, z + q], .12, .16); }
    for (const y of [.74, .86]) mb.beam([x - w * 1.3, h * y, z], [x + w * 1.3, h * y, z], .13, .16);
  }
  mb.commit(grp); lz.commit(grp, matEmissivo, false);
}

/* CÉU — as nuvens do index (canvas de montarTitulo) ou as formas da Godot (TitleScene._textura_ceu + sky.gdshader) */
function texturaCeuIndex(r) {
  const cc = document.createElement('canvas'); cc.width = 512; cc.height = 256; const q = cc.getContext('2d'), gr = q.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, AB.ceu_topo); gr.addColorStop(.32, AB.ceu_meio); gr.addColorStop(.5, AB.ceu_horiz); gr.addColorStop(1, AB.ceu_horiz); q.fillStyle = gr; q.fillRect(0, 0, 512, 256);

}

  const uc = AB.nuvem_lado, uv = uc - .05, n = AB.nuvem_bolhas | 0, op = AB.nuvem_opacidade, fm = (a, m) => ((a % m) + m) % m;
  const ang = AB.nuvem_inclina * D2R, cs = Math.cos(ang), sn = Math.sin(ang), borda = Math.max(.01, AB.nuvem_borda);
  const bolha = (a, b, rx, ry, col, o, baseY = Infinity) => { // uma bolha de nuvem: elipse girada, borda macia; baseY corta por baixo
    const e = Math.max(rx, ry);
